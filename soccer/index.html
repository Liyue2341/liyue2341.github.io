  <style>
    :root{--ink:#09243c;--blue:#238fc6;--pale:#e8f8fe;--gold:#f3c34d;--muted:#64798a}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#79c8ed,#d7f2fc 31rem,#f7fbfd 50rem)}button,input{font:inherit}button{touch-action:manipulation}header,.hero,.rules{max-width:720px;margin:auto;padding-left:20px;padding-right:20px}header{height:64px;display:flex;align-items:center;justify-content:space-between;font-weight:900}.logo{display:flex;align-items:center;gap:8px}.logo i{font-style:normal;background:#fff;color:var(--blue);width:29px;height:29px;border-radius:50%;display:grid;place-items:center;box-shadow:0 5px 15px #13506f18}.live{font-size:10px;letter-spacing:.16em;background:#ffffff99;border:1px solid #ffffffbb;padding:8px 10px;border-radius:99px}.live:before{content:"";display:inline-block;width:6px;height:6px;background:#e65454;border-radius:50%;margin-right:6px}.hero{padding-top:28px;padding-bottom:19px}.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:900;opacity:.58}.hero h1{font-size:clamp(38px,8vw,64px);line-height:1.05;letter-spacing:-.055em;margin:12px 0}.hero h1 em{font-style:normal;color:#fff}.hero>p:last-child{max-width:600px;line-height:1.7;opacity:.7}.shell{max-width:680px;min-height:360px;margin:24px auto;padding:22px;background:#fffffff1;border:1px solid #fff;border-radius:27px;box-shadow:0 25px 75px #15516f2b}.top{display:flex;align-items:end;justify-content:space-between;margin-bottom:17px}.top b{font-size:22px;letter-spacing:-.02em}.top small{color:var(--muted)}.stake{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:17px;padding:15px 17px;margin-bottom:18px}.stake span,.stake small{display:block}.stake span{font-weight:900}.stake small{opacity:.55;margin-top:4px}.stake label{color:var(--gold);font-weight:900}.stake input{width:65px;background:transparent;border:0;border-bottom:1px solid #ffffff44;color:#fff;font-size:22px;font-weight:900;text-align:center}.name{display:block;font-size:12px;font-weight:900;color:var(--muted);margin:8px 2px 22px}.name input{display:block;width:100%;border:0;border-bottom:2px solid #d9e9f0;background:transparent;padding:9px 2px;margin-top:5px;font-size:20px;font-weight:900;color:var(--ink);outline:0}.intro{background:var(--pale);border-radius:17px;padding:16px;margin-bottom:8px}.intro b{display:block;margin-bottom:7px}.intro p{font-size:13px;line-height:1.65;color:var(--muted);margin:0}.progress{height:7px;background:#e2eef3;border-radius:99px;overflow:hidden;margin-bottom:22px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#61b9e5,var(--blue));border-radius:99px;transition:width .25s}.question-no{font-size:11px;font-weight:900;color:var(--blue);letter-spacing:.12em}.question h2{font-size:23px;line-height:1.35;margin:8px 0 6px;letter-spacing:-.025em}.question>p{font-size:13px;color:var(--muted);line-height:1.6;margin:0 0 18px}.options{display:grid;gap:9px}.options button{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid #dcebf1;background:#fff;color:var(--ink);border-radius:14px;padding:13px 14px;font-weight:800;cursor:pointer}.options button i{font-style:normal;width:27px;height:27px;border-radius:9px;background:#eef7fa;color:#5c7687;display:grid;place-items:center;font-size:11px}.options button.on{background:var(--ink);border-color:var(--ink);color:#fff;box-shadow:0 8px 18px #09243c26}.options button.on i{background:#ffffff20;color:var(--gold)}.nav{display:grid;grid-template-columns:1fr 2fr;gap:9px;margin-top:18px}.primary,.ghost{border:0;border-radius:14px;padding:14px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff;box-shadow:0 9px 22px #238fc63e}.primary:disabled{opacity:.45;box-shadow:none}.ghost{background:#edf5f8;color:var(--ink)}.full{width:100%;margin-top:17px}.error{background:#fff0f0;color:#b73535;padding:10px 12px;border-radius:10px;font-size:13px}.profile{background:var(--ink);color:#fff;border-radius:18px;padding:18px;margin:12px 0}.profile small{opacity:.55}.profile h3{color:var(--gold);font-size:24px;margin:7px 0}.profile p{font-size:13px;opacity:.7;line-height:1.6;margin:0}.share{text-align:center;background:var(--pale);padding:16px;border-radius:16px}.share p{font-size:13px;line-height:1.6;color:var(--muted)}.locked{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;padding:15px 17px;border-radius:16px;margin-bottom:17px}.locked span{opacity:.65;font-size:13px}.locked b{color:var(--gold)}.ticket{overflow:hidden;border:1px solid #d9e9ef;border-radius:18px;background:#fff}.ticket-head{display:flex;justify-content:space-between;padding:15px 16px;background:#edf9fd;font-size:13px}.ticket-head strong{color:var(--blue)}.player{padding:16px;border-top:1px solid #eaf1f4}.player-title{display:flex;justify-content:space-between;align-items:center}.player-title small{color:var(--muted)}.player-title b{font-size:18px}.badge{background:#e6f7fd;color:var(--blue);font-size:11px;font-weight:900;padding:6px 8px;border-radius:99px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:13px}.answers span{font-size:11px;line-height:1.4;color:#5d7484;background:#f3f8fa;padding:8px;border-radius:9px}.settle{margin-top:17px;border-top:1px solid #e1ebef;padding-top:15px}.settle summary{font-weight:900;cursor:pointer}.actual{display:grid;gap:17px;margin-top:15px}.actual-q b{display:block;font-size:13px;margin-bottom:8px}.mini{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.mini button{border:1px solid #dbeaf0;background:#fff;color:var(--ink);border-radius:10px;padding:9px 4px;font-size:11px;font-weight:800}.mini button.on{background:var(--ink);color:#fff}.result{background:var(--ink);color:#fff;border-radius:17px;padding:18px;margin-top:14px}.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.money div{background:#ffffff12;padding:12px;border-radius:12px}.money small,.money b{display:block}.money small{opacity:.55}.money b{font-size:24px;color:var(--gold);margin-top:4px}.bar{height:10px;display:flex;background:#ffffff22;border-radius:99px;overflow:hidden;margin:16px 0}.bar span{display:block;height:100%}.result>p{font-size:12px;line-height:1.6;opacity:.7;margin:0}.rules{padding-top:27px;padding-bottom:50px}.rules h2{font-size:25px}.weights{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.weights div{background:#fff;border:1px solid #e0edf2;border-radius:13px;padding:12px 8px}.weights b,.weights span{display:block}.weights b{color:var(--blue);font-size:18px}.weights span{font-size:10px;opacity:.65;margin-top:6px}.rules>p{font-size:13px;opacity:.62;line-height:1.75}footer{text-align:center;font-size:12px;opacity:.45;padding-bottom:35px}@media(max-width:600px){.hero{padding-top:18px}.hero>p:last-child{font-size:14px}.shell{margin:20px 11px;padding:15px;border-radius:22px}.question h2{font-size:21px}.weights{grid-template-columns:repeat(2,1fr)}.weights div:last-child{grid-column:span 2}.answers{grid-template-columns:1fr}.money{grid-template-columns:1fr}.money b{font-size:24px}}
  </style>
</head>
<body>
  <header><div class="logo"><i>✦</i>世界杯决赛读局</div><span class="live">FINAL · 03:00</span></header>
  <section class="hero"><p class="eyebrow">ARGENTINA × SPAIN</p><h1>不是猜中或猜错，<br><em>而是你读懂了多少。</em></h1><p>两人或三人预测阿根廷对西班牙的世界杯决赛：整场最终比分、梅西进球、首球时段与冠军方式。各自投入 ¥50–¥100，赛后按预测质量分配奖池。</p></section>
  <section class="shell" id="app"></section>
  <section class="rules"><h2>算法在衡量什么？</h2><div class="weights"><div><b>25%</b><span>阿根廷进球</span></div><div><b>25%</b><span>西班牙进球</span></div><div><b>20%</b><span>梅西进球</span></div><div><b>10%</b><span>首球时间</span></div><div><b>20%</b><span>冠军方式</span></div></div><p>前两题组合成整场最终比分：包含加时赛，不包含点球大战。答案并非简单对错，相邻进球数、相邻时间段和同一冠军的不同夺冠方式都会获得部分匹配度。两人或三人一样准时，都会恰好各自拿回本金。</p></section>
  <footer>朋友之间娱乐 · 预测有分歧，支持在一起</footer>
<script>
const W=[.25,.25,.20,.10,.20], app=document.querySelector('#app');
const blank=()=>({name:'',stake:50,answers:[null,null,null,null,null]});
let state={mode:'create',step:-1,players:[],me:blank(),duel:null,link:'',error:'',actual:[null,null,null,null,null]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const encode=o=>encodeURIComponent(JSON.stringify(o));
const decode=s=>{try{return JSON.parse(decodeURIComponent(s))}catch{return null}};
const base=()=>location.origin+location.pathname;
const QUESTIONS=[
 {title:'整场比赛，阿根廷会进几球？',hint:'包含加时赛，不包含点球大战；与下一题组成最终比分。',opts:['0 球','1 球','2 球','3 球或以上']},
 {title:'整场比赛，西班牙会进几球？',hint:'包含加时赛，不包含点球大战。',opts:['0 球','1 球','2 球','3 球或以上']},
 {title:'梅西会进几球？',hint:'计算常规时间与加时赛，不计算点球大战。',opts:['不会进球','进 1 球','进 2 球或以上']},
 {title:'全场第一个进球何时出现？',hint:'补时计入所在半场，加时赛单独计算。',opts:['1–20 分钟','21–45+ 分钟','46–70 分钟','71–90+ 分钟','加时赛才出现','整场没有进球']},
 {title:'世界杯冠军将怎样产生？',hint:'判断冠军归属，以及奖杯在常规时间、加时还是点球后产生。',opts:['阿根廷 90 分钟夺冠','阿根廷加时夺冠','阿根廷点球夺冠','西班牙 90 分钟夺冠','西班牙加时夺冠','西班牙点球夺冠']}
];
function profile(p){let a=p.answers;if(a[2]===2)return['梅西主角派','你相信梅西会用不止一个进球定义这场决赛。'];if(a[4]===1||a[4]===2)return['苦战加冕派','你相信阿根廷最终夺冠，但奖杯要到加时或点球后才有归属。'];if(a[4]>=3)return['冷静逆风派','你支持阿根廷，也愿意诚实写下西班牙夺冠的比赛剧本。'];if(a[0]>=3||a[1]>=3)return['开放决赛派','你预期这会是一场高比分、难以控制的决赛。'];if(a[0]+a[1]<=1)return['谨慎决赛派','你认为决赛会先被风险控制，细节比攻势更重要。'];return['蓝白加冕派','你的比分与夺冠方式共同指向阿根廷捧杯。']}
function setup(){let join=state.mode==='join',slot=state.players.length+1,locked=state.players.map((p,i)=>`<div class="locked"><span>玩家 ${i+1} · ${esc(p.name)} · ¥${p.stake}</span><b>预测已密封</b></div>`).join('');app.innerHTML=`<div class="top"><b>${join?'加入预测挑战':'建立预测挑战'}</b><small>第 ${slot} 位 · 最多 3 人</small></div>${locked}<div class="stake"><div><span>你的投入</span><small>限 ¥50–¥100 · 每人可不同</small></div><label>¥ <input id="stake" type="number" min="50" max="100" value="${state.me.stake}"></label></div><label class="name">你的名字<input id="name" maxlength="14" placeholder="输入昵称" value="${esc(state.me.name)}"></label><div class="intro"><b>两人即可成局，最多三人</b><p>每人连续回答 5 道选择题。第二人完成后可以直接生成结果页，也可以继续把密封链接传给第三人。</p></div>${state.error?`<p class="error">${esc(state.error)}</p>`:''}<button class="primary full" id="start">开始五题测试</button>`;document.querySelector('#name').oninput=e=>state.me.name=e.target.value;document.querySelector('#stake').oninput=e=>state.me.stake=Number(e.target.value);document.querySelector('#start').onclick=()=>{if(!state.me.name.trim()){state.error='请先填名字。';return render()}if(state.players.some(p=>p.name.trim()===state.me.name.trim())){state.error='玩家的名字需要不同。';return render()}if(state.me.stake<50||state.me.stake>100){state.error='每个人的投入必须在 ¥50–¥100 之间。';return render()}state.me.stake=Math.round(state.me.stake);state.error='';state.step=0;render()}}
function quiz(){let p=state.me,q=QUESTIONS[state.step],selected=p.answers[state.step];app.innerHTML=`<div class="top"><b>玩家 ${state.players.length+1} 的比赛剧本</b><small>${state.step+1} / 5</small></div><div class="progress"><i style="width:${(state.step+1)*20}%"></i></div><div class="question"><span class="question-no">QUESTION ${String(state.step+1).padStart(2,'0')}</span><h2>${q.title}</h2><p>${q.hint}</p><div class="options">${q.opts.map((o,i)=>`<button data-i="${i}" class="${selected===i?'on':''}"><i>${String.fromCharCode(65+i)}</i>${o}</button>`).join('')}</div></div><div class="nav"><button class="ghost" id="back">返回</button><button class="primary" id="next" ${selected===null?'disabled':''}>${state.step===4?'完成测试':'下一题'}</button></div>`;document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{p.answers[state.step]=Number(b.dataset.i);render()});document.querySelector('#back').onclick=()=>{state.step--;render()};document.querySelector('#next').onclick=()=>{if(p.answers[state.step]===null)return;if(state.step<4){state.step++;render()}else finishQuiz()}}
function startDuel(){state.duel={v:4,players:JSON.parse(JSON.stringify(state.players))};state.link=base()+'?duel='+encode(state.duel);state.mode='duel';state.step=-1;render()}
function finishQuiz(){state.players.push(JSON.parse(JSON.stringify(state.me)));if(state.players.length<3){state.link=base()+'?inv='+encode({v:4,players:state.players});state.step=5;render()}else startDuel()}
async function copy(text,b){try{await navigator.clipboard.writeText(text)}catch{let t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}let old=b.textContent;b.textContent='已复制，发给朋友吧';setTimeout(()=>b.textContent=old,1600)}
function completed(){let current=state.players[state.players.length-1],pr=profile(current),next=state.players.length+1,two=state.players.length===2;app.innerHTML=`<div class="top"><b>你的预测画像</b><small>第 ${state.players.length} 棒完成</small></div><div class="profile"><small>${esc(current.name)} 的比赛剧本</small><h3>${pr[0]}</h3><p>${pr[1]}</p></div><div class="share"><b>${two?'两人局已经成立':'答案已密封'}</b><p>${two?'现在可以直接锁定两人预测，也可以继续邀请第三位玩家。':`把接力链接发给第 ${next} 位玩家。他只能看到已有预测已提交，不会看到具体答案。`}</p></div>${two?'<button class="primary full" id="finalize">就两个人，生成最终结果页</button><button class="ghost full" id="copy">继续邀请第三位玩家</button>':`<button class="primary full" id="copy">复制第 ${next} 位玩家链接</button>`}<button class="ghost full" id="edit">返回修改答案</button>`;if(two)document.querySelector('#finalize').onclick=startDuel;document.querySelector('#copy').onclick=e=>copy(state.link,e.currentTarget);document.querySelector('#edit').onclick=()=>{state.me=state.players.pop();state.step=0;state.link='';render()}}
function scoreLabel(p){let g=['0','1','2','3+'];return `最终比分：阿根廷 ${g[p.answers[0]]}–${g[p.answers[1]]} 西班牙`}
function playerHTML(p,i){let pr=profile(p);return `<div class="player"><div class="player-title"><div><small>玩家 ${i+1} · 投入 ¥${p.stake}</small><b>${esc(p.name)}</b><small>${scoreLabel(p)}</small></div><span class="badge">${pr[0]}</span></div><div class="answers">${QUESTIONS.map((q,k)=>`<span>${k+1}. ${esc(q.opts[p.answers[k]])}</span>`).join('')}</div></div>`}
function similarity(q,p,a){if(p===a)return 1;if(q===0||q===1){let d=Math.abs(p-a);return d===1?.65:d===2?.25:.05}if(q===2){let d=Math.abs(p-a);return d===1?.45:.05}if(q===3){if(p===5||a===5)return .05;let d=Math.abs(p-a);return d===1?.65:d===2?.25:.05}let meta=[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]],x=meta[p],y=meta[a];return x[0]===y[0]?Math.max(.3,1-.35*Math.abs(x[1]-y[1])):.02}
function calculate(){let d=state.duel,loss=p=>p.answers.reduce((sum,x,q)=>sum+W[q]*(-Math.log(.08+.92*similarity(q,x,state.actual[q]))),0),losses=d.players.map(loss),qualities=losses.map(x=>Math.exp(-2.2*x)),claims=qualities.map((q,i)=>q*d.players[i].stake),claimSum=claims.reduce((a,b)=>a+b,0),total=d.players.reduce((s,p)=>s+p.stake,0),floorTotal=total*.05,raw=claims.map(c=>c/claimSum),last=d.players.length-1,payouts=raw.map((r,i)=>i<last?Math.round((d.players[i].stake*.05+(total-floorTotal)*r)*100)/100:0);payouts[last]=Math.round((total-payouts.slice(0,last).reduce((a,b)=>a+b,0))*100)/100;return{payouts,accuracies:losses.map(x=>Math.round(Math.exp(-x)*100)),shares:payouts.map(x=>x/total)}}
function duel(){let d=state.duel,n=d.players.length,total=d.players.reduce((s,p)=>s+p.stake,0),ready=state.actual.every(x=>x!==null),r=ready?calculate():null,colors=['linear-gradient(90deg,#f3c34d,#f7d56f)','#69c4ec','#a595ee'];app.innerHTML=`<div class="top"><b>${n} 人预测已锁定</b><small>奖池 ¥${total}</small></div><div class="ticket"><div class="ticket-head"><span>${n} 份比赛剧本</span><strong>本金 × 准确度</strong></div>${d.players.map(playerHTML).join('')}</div><button class="primary full" id="copy">复制最终赌约链接</button><details class="settle" ${ready?'open':''}><summary>赛后结算：选择真实发生的结果</summary><div class="actual">${QUESTIONS.map((q,k)=>`<div class="actual-q"><b>${k+1}. ${q.title}</b><div class="mini">${q.opts.map((o,i)=>`<button data-q="${k}" data-v="${i}" class="${state.actual[k]===i?'on':''}">${o}</button>`).join('')}</div></div>`).join('')}</div>${r?`<div class="result"><div class="money" style="grid-template-columns:repeat(${n},1fr)">${d.players.map((p,i)=>`<div><small>${esc(p.name)} · 投入 ¥${p.stake} · 匹配度 ${r.accuracies[i]}%</small><b>¥${r.payouts[i].toFixed(2)}</b></div>`).join('')}</div><div class="bar">${r.shares.map((s,i)=>`<span style="width:${s*100}%;background:${colors[i]}"></span>`).join('')}</div><p>每人先保留自己本金的 5%；剩余奖池按“个人投入 × 非线性预测质量”的比例分配。若所有人预测质量完全相同，每个人都会恰好拿回自己的原始投入。</p></div>`:`<div class="intro"><p>五项真实结果全部选择后，系统会根据 ${n} 个人各自的投入和预测质量自动分钱。</p></div>`}</details>`;document.querySelector('#copy').onclick=e=>copy(state.link||location.href,e.currentTarget);document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{state.actual[Number(b.dataset.q)]=Number(b.dataset.v);render()})}
function render(){if(state.mode==='duel')return duel();if(state.step===-1)return setup();if(state.step===5)return completed();quiz()}
let params=new URLSearchParams(location.search),duelData=decode(params.get('duel')),invite=decode(params.get('inv'));if(duelData&&duelData.v===4&&Array.isArray(duelData.players)&&duelData.players.length>=2&&duelData.players.length<=3){state.duel=duelData;state.players=duelData.players;state.mode='duel';state.link=location.href}else if(invite&&invite.v===4&&Array.isArray(invite.players)&&invite.players.length>0&&invite.players.length<3){state.players=invite.players;state.mode='join'}render();
</script>
</body></html>
