<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#76c5eb"><title>阿根廷同路人挑战</title><style>
:root{--ink:#09233b;--blue:#268fc3;--pale:#e7f7fd;--gold:#f5c54c}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(180deg,#81cbee 0,#d8f2fc 30rem,#f7fbfd 50rem);min-height:100vh}button,input{font:inherit}header,.hero,.rules{max-width:720px;margin:auto;padding-left:20px;padding-right:20px}header{height:64px;display:flex;align-items:center;justify-content:space-between;font-weight:900}.logo{display:flex;align-items:center;gap:8px}.logo i{font-style:normal;background:#fff;color:var(--blue);width:28px;height:28px;border-radius:50%;display:grid;place-items:center}.live{font-size:10px;letter-spacing:.16em;background:#ffffff99;padding:8px 10px;border-radius:99px}.live:before{content:"";display:inline-block;width:6px;height:6px;background:#e65353;border-radius:50%;margin-right:6px}.hero{padding-top:30px;padding-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:900;opacity:.6}.hero h1{font-size:clamp(38px,8vw,64px);line-height:1.05;letter-spacing:-.05em;margin:12px 0}.hero h1 em{font-style:normal;color:#fff}.hero>p:last-child{max-width:580px;line-height:1.7;opacity:.7}.shell{max-width:680px;margin:24px auto;padding:22px;background:#ffffffee;border:1px solid #fff;border-radius:26px;box-shadow:0 24px 70px #15516f2b}.top{display:flex;align-items:end;justify-content:space-between;margin-bottom:16px}.top b{font-size:22px}.top small{opacity:.5}.stake,.opponent{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#fff;border-radius:17px;padding:15px 17px;margin-bottom:16px}.stake span,.stake small{display:block}.stake span{font-weight:900}.stake small{opacity:.55;margin-top:4px}.stake label{color:var(--gold);font-weight:900}.stake input{width:66px;background:transparent;border:0;border-bottom:1px solid #ffffff44;color:#fff;font-weight:900;font-size:22px;text-align:center}.card{border:1px solid #dceaf0;background:#fff;border-radius:20px;padding:17px}.name{display:block;font-size:12px;font-weight:900;opacity:.65}.name input{display:block;width:100%;border:0;border-bottom:2px solid #dbeaf0;padding:9px 2px;margin-top:5px;font-size:19px;font-weight:900;outline:0}.q{display:grid;grid-template-columns:34px 1fr;gap:9px;margin:20px 0 13px}.q i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#def4fc;color:var(--blue);font-size:11px;font-weight:900}.q h3{font-size:16px;margin:1px 0 4px}.q p{font-size:12px;line-height:1.5;opacity:.55;margin:0}.score{display:flex;align-items:center;justify-content:center;gap:10px;background:#f0f9fc;padding:15px 8px;border-radius:16px}.team{display:flex;align-items:center;gap:7px}.team strong{font-size:13px}.score input{width:48px;height:48px;border:0;border-radius:12px;background:#fff;text-align:center;font-size:23px;font-weight:900;color:var(--ink);box-shadow:0 4px 12px #09233b10}.flag{width:26px;height:19px;border-radius:3px;display:grid;place-items:center;font-size:7px;font-weight:900}.ar{background:linear-gradient(#77c9ef 0 33%,#fff 33% 66%,#77c9ef 66%)}.en{background:#fff;color:#c33;border:1px solid #d55}.choices,.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choices button,.mini button{border:1px solid #dceaf0;background:#fff;color:var(--ink);border-radius:11px;padding:11px 4px;font-size:12px;font-weight:900}.choices .on,.mini .on{background:var(--ink);border-color:var(--ink);color:#fff}.minute{display:inline-flex;align-items:center;background:#f0f9fc;border-radius:12px;padding:8px 13px;gap:6px}.minute input{width:65px;border:0;background:transparent;font-size:21px;font-weight:900;outline:0}.minute span{font-size:12px;opacity:.6}.primary{width:100%;border:0;border-radius:15px;padding:15px;background:var(--blue);color:#fff;font-weight:900;margin-top:17px;box-shadow:0 9px 22px #268fc340}.error{background:#fff0f0;color:#b83333;border-radius:10px;padding:10px;font-size:13px}.share{text-align:center;background:#ecf9fe;padding:16px;border-radius:16px;margin-top:16px}.share p{font-size:13px;line-height:1.6;opacity:.65}.opponent{font-size:13px}.opponent span{opacity:.7}.ticket{overflow:hidden;border:1px solid #d9e9ef;border-radius:18px;background:#fff}.ticket-head,.player{display:flex;justify-content:space-between;align-items:center;padding:16px}.ticket-head{background:#edf9fd;font-size:13px}.ticket-head strong{color:var(--blue)}.player{border-top:1px solid #edf3f5}.player small,.player strong,.pred b,.pred span{display:block}.player small{opacity:.45;margin-bottom:3px}.pred{text-align:right}.pred b{font-size:22px}.pred span{font-size:11px;opacity:.55;margin-top:3px}.settle{margin-top:16px;border-top:1px solid #e4edf1;padding-top:14px}.settle summary{font-weight:900;cursor:pointer}.actual{display:grid;gap:13px;background:#f1f8fb;padding:14px;border-radius:14px;margin-top:13px}.actual label{font-size:12px;font-weight:900}.actual input{width:62px;padding:8px;border:1px solid #d3e4eb;border-radius:8px;text-align:center;margin-top:6px}.actscore{display:flex;align-items:center;gap:7px}.mini button{padding:8px 2px;font-size:11px}.result{background:var(--ink);color:#fff;border-radius:14px;padding:15px;text-align:center;margin-top:11px}.result p{display:flex;justify-content:center;gap:20px;font-size:12px;opacity:.65}.result strong{color:var(--gold);font-size:17px}.rules{padding-top:30px;padding-bottom:50px}.rules h2{font-size:25px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.grid div{background:#fff;border:1px solid #e0edf2;border-radius:14px;padding:14px 9px}.grid b,.grid span{display:block}.grid b{color:var(--blue);font-size:21px}.grid span{font-size:11px;opacity:.65;margin-top:6px}.rules>p{font-size:13px;opacity:.6;line-height:1.7}footer{text-align:center;font-size:12px;opacity:.45;padding-bottom:35px}@media(max-width:600px){.hero{padding-top:18px}.shell{margin:20px 11px;padding:15px}.card{padding:13px}.score{gap:4px}.team{gap:4px}.team strong{display:none}.grid{grid-template-columns:1fr 1fr}.opponent{align-items:flex-start;flex-direction:column;gap:6px}}
</style></head><body><header><div class="logo"><i>✦</i>同路人挑战</div><span class="live">TONIGHT</span></header><section class="hero"><p class="eyebrow">ARGENTINA × ENGLAND</p><h1>都想阿根廷赢，<br><em>那就赌谁更懂比赛。</em></h1><p>两个人站同一边，也能玩出胜负。各放 50，三道题生成一张清楚、好结算的赌约。</p></section><section class="shell" id="app"></section><section class="rules"><h2>怎么算赢？</h2><div class="grid"><div><b>6</b><span>精确比分</span></div><div><b>+2</b><span>猜中一队进球</span></div><div><b>+3</b><span>猜中净胜球</span></div><div><b>+2</b><span>猜中胜负阶段</span></div></div><p>同分时，看谁猜的首球时间更接近；仍然相同则退回各自本金。精确比分与单队进球可叠加。</p></section><footer>仅供朋友之间娱乐 · 理性玩，别上头</footer><script>
const S=['90分钟','加时赛','点球大战'],A=document.querySelector('#app'),mk=(name='',arg=2,eng=1,stage='90分钟',first=24)=>({name,arg,eng,stage,first});let X={mode:'create',stake:50,p1:mk(),p2:mk('',1,0,'90分钟',38),duel:null,link:'',err:'',actual:{arg:2,eng:1,stage:'90分钟',first:24}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=(v,a,b)=>Math.max(a,Math.min(b,Number(v)||a)),enc=o=>encodeURIComponent(JSON.stringify(o)),dec=s=>{try{return JSON.parse(decodeURIComponent(s))}catch{return null}},base=()=>location.origin+location.pathname;
function picker(p){return `<div class="card"><label class="name">你的名字<input id="name" maxlength="14" placeholder="输入昵称" value="${esc(p.name)}"></label><div class="q"><i>01</i><div><h3>90 分钟结束时，比分是多少？</h3><p>就算进入加时，也按这里的比分算。</p></div></div><div class="score"><div class="team"><span class="flag ar">AR</span><strong>阿根廷</strong><input id="arg" type="number" min="0" max="12" value="${p.arg}"></div><b>:</b><div class="team"><input id="eng" type="number" min="0" max="12" value="${p.eng}"><strong>英格兰</strong><span class="flag en">EN</span></div></div><div class="q"><i>02</i><div><h3>阿根廷在哪个阶段锁定胜局？</h3><p>这是独立得分题。</p></div></div><div class="choices">${S.map(s=>`<button data-s="${s}" class="${s===p.stage?'on':''}">${s}</button>`).join('')}</div><div class="q"><i>03</i><div><h3>第一个进球在第几分钟？</h3><p>总分相同时，谁更接近谁赢。</p></div></div><div class="minute"><input id="first" type="number" min="1" max="120" value="${p.first}"><span>分钟</span></div></div>`}
function bind(k){let p=X[k];['name','arg','eng'].forEach(id=>document.querySelector('#'+id).oninput=e=>p[id]=id==='name'?e.target.value:num(e.target.value,0,12));document.querySelector('#first').oninput=e=>p.first=num(e.target.value,1,120);document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{p.stage=b.dataset.s;render()})}function error(){return X.err?`<p class="error">${esc(X.err)}</p>`:''}function valid(p,second){if(!p.name.trim())return'请先填名字。';if(second&&p.name.trim()===X.p1.name.trim())return'两位玩家的名字要不一样。';if(p.stage==='90分钟'&&p.arg<=p.eng)return'如果押 90 分钟获胜，比分必须是阿根廷领先。';return''}
async function cp(text,b){try{await navigator.clipboard.writeText(text)}catch{let t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()}b.textContent='已复制，发给朋友吧';setTimeout(()=>b.textContent=b.dataset.old,1500)}
function create(){A.innerHTML=`<div class="top"><b>你的预测</b><small>第 1 / 2 位玩家</small></div><div class="stake"><div><span>每人押注</span><small>赢家拿走全部奖池</small></div><label>¥<input id="stake" type="number" min="1" max="999" value="${X.stake}"></label></div>${picker(X.p1)}${error()}${X.link?`<div class="share"><b>第一棒完成</b><p>把链接发给朋友，他填完自己的预测后会生成最终赌约。</p><button class="primary copy" data-old="复制邀请链接">复制邀请链接</button></div>`:`<button class="primary" id="go">生成朋友答题链接</button>`}`;bind('p1');document.querySelector('#stake').oninput=e=>X.stake=num(e.target.value,1,999);if(X.link)document.querySelector('.copy').onclick=e=>cp(X.link,e.currentTarget);else document.querySelector('#go').onclick=()=>{X.err=valid(X.p1,false);if(!X.err)X.link=base()+'?inv='+enc({stake:X.stake,p1:X.p1});render()}}
function join(){A.innerHTML=`<div class="top"><b>接受挑战</b><small>第 2 / 2 位玩家</small></div><div class="opponent"><span>${esc(X.p1.name)} 已下注 ¥${X.stake}</span><b>${X.p1.arg} : ${X.p1.eng} · ${esc(X.p1.stage)}</b></div>${picker(X.p2)}${error()}<button class="primary" id="done">锁定答案，生成赌约</button>`;bind('p2');document.querySelector('#done').onclick=()=>{X.err=valid(X.p2,true);if(!X.err&&JSON.stringify(X.p1)===JSON.stringify(X.p2))X.err='答案完全一样，至少改一题。';if(X.err)return render();X.duel={stake:X.stake,p1:X.p1,p2:X.p2};X.link=base()+'?duel='+enc(X.duel);X.mode='duel';render()}}
function points(p,a){let n=0;if(p.arg===a.arg&&p.eng===a.eng)n+=6;if(p.arg===a.arg)n+=2;if(p.eng===a.eng)n+=2;if(p.arg-p.eng===a.arg-a.eng)n+=3;if(p.stage===a.stage)n+=2;return n}function result(){let d=X.duel,a=points(d.p1,X.actual),b=points(d.p2,X.actual),w='平局，双方各退回本金';if(a>b)w=`${esc(d.p1.name)} 赢得 ¥${d.stake*2}`;else if(b>a)w=`${esc(d.p2.name)} 赢得 ¥${d.stake*2}`;else{let x=Math.abs(d.p1.first-X.actual.first),y=Math.abs(d.p2.first-X.actual.first);if(x<y)w=`${esc(d.p1.name)} 靠首球时间赢得 ¥${d.stake*2}`;else if(y<x)w=`${esc(d.p2.name)} 靠首球时间赢得 ¥${d.stake*2}`}return{a,b,w}}
function duel(){let d=X.duel,r=result();A.innerHTML=`<div class="top"><b>赌约已成立</b><small>保存这个链接</small></div><div class="ticket"><div class="ticket-head"><span>共同看好阿根廷</span><strong>奖池 ¥${d.stake*2}</strong></div>${[d.p1,d.p2].map((p,i)=>`<div class="player"><div><small>玩家 ${i+1}</small><strong>${esc(p.name)}</strong></div><div class="pred"><b>${p.arg} : ${p.eng}</b><span>${esc(p.stage)} · 首球 ${p.first}′</span></div></div>`).join('')}</div><button class="primary copy" data-old="复制最终赌约链接">复制最终赌约链接</button><details class="settle"><summary>赛后结算（输入真实结果）</summary><div class="actual"><label>90 分钟比分<div class="actscore"><input id="aa" type="number" min="0" value="${X.actual.arg}"><b>:</b><input id="ae" type="number" min="0" value="${X.actual.eng}"></div></label><label>胜负阶段<div class="mini">${S.map(s=>`<button data-a="${s}" class="${s===X.actual.stage?'on':''}">${s}</button>`).join('')}</div></label><label>第一个进球<br><input id="af" type="number" min="1" max="120" value="${X.actual.first}"></label></div><div class="result"><p><span>${esc(d.p1.name)}：${r.a} 分</span><span>${esc(d.p2.name)}：${r.b} 分</span></p><strong>${r.w}</strong></div></details>`;document.querySelector('.copy').onclick=e=>cp(X.link||location.href,e.currentTarget);['aa','ae','af'].forEach(id=>document.querySelector('#'+id).onchange=e=>{X.actual[id==='aa'?'arg':id==='ae'?'eng':'first']=num(e.target.value,id==='af'?1:0,id==='af'?120:20);duel();document.querySelector('details').open=true});document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{X.actual.stage=b.dataset.a;duel();document.querySelector('details').open=true})}
function render(){X.mode==='create'?create():X.mode==='join'?join():duel()}let q=new URLSearchParams(location.search),d=dec(q.get('duel')),i=dec(q.get('inv'));if(d&&d.p1&&d.p2){X.duel=d;X.stake=d.stake;X.mode='duel';X.link=location.href}else if(i&&i.p1){X.p1=i.p1;X.stake=i.stake;X.mode='join'}render();
</script></body></html>
